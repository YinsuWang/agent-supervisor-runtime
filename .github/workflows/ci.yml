name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20.19
      - name: Install dependencies
        run: npm install
      - name: Typecheck
        run: npm run typecheck
      - name: Test platform-neutral suite
        run: npm run test:ci:neutral
      - name: Test Windows runtime and setup integrations
        if: runner.os == 'Windows'
        run: npm run test:ci:windows
      - name: Build
        run: npm run build
      - name: Smoke release native host
        run: npm run test:release-artifact
