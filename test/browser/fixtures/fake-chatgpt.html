<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Fake ChatGPT</title>
</head>
<body>
  <main
    id="conversation-root"
    data-conversation-id="fake-conversation"
    data-conversation-url="https://chatgpt.com/c/fake-conversation"
  >
    <section id="messages" aria-label="Conversation messages"></section>
    <div id="composer" role="textbox" aria-label="Message ChatGPT" contenteditable="true"></div>
    <button id="send" type="button" aria-label="Send message">Send</button>
    <button id="stop" type="button" aria-label="Stop generating" hidden>Stop</button>
    <button id="continue" type="button" aria-label="Continue generating" hidden>Continue</button>
    <button id="retry" type="button" aria-label="Try again" hidden>Try again</button>
    <button id="break-capability" type="button">Break composer capability</button>
  </main>
  <script>
    (() => {
      const root = document.querySelector('#conversation-root');
      const messages = document.querySelector('#messages');
      const composer = document.querySelector('#composer');
      const send = document.querySelector('#send');
      const stop = document.querySelector('#stop');
      const continueButton = document.querySelector('#continue');
      const retry = document.querySelector('#retry');
      const breaker = document.querySelector('#break-capability');
      let sequence = 0;
      let generationToken = 0;
      let activeGeneration;

      function appendMessage(role, content) {
        sequence += 1;
        const article = document.createElement('article');
        article.dataset.messageAuthorRole = role;
        article.dataset.messageId = `${role}-${sequence}`;
        article.setAttribute('aria-label', `${role} message`);
        article.textContent = content;
        messages.append(article);
        return article;
      }

      send.addEventListener('click', () => {
        const text = composer.textContent.trim();
        if (!text) return;
        continueButton.hidden = true;
        retry.hidden = true;
        appendMessage('user', text);
        composer.textContent = '';
        send.disabled = true;

        const token = ++generationToken;
        const assistant = appendMessage('assistant', '');
        stop.hidden = false;
        activeGeneration = { token, assistant, chunks: ['Fake ', 'assistant ', 'response'], index: 0 };
      });

      stop.addEventListener('click', () => {
        generationToken += 1;
        activeGeneration = undefined;
        stop.hidden = true;
        send.disabled = false;
      });

      window.fakeChatGpt = {
        emitNextChunk() {
          if (!activeGeneration || activeGeneration.token !== generationToken) return;
          activeGeneration.assistant.textContent += activeGeneration.chunks[activeGeneration.index++];
          if (activeGeneration.index === activeGeneration.chunks.length) {
            activeGeneration = undefined;
            stop.hidden = true;
            send.disabled = false;
          }
        },
        completeGeneration() {
          while (activeGeneration) this.emitNextChunk();
        },
        duplicateLastMessage() {
          const last = messages.lastElementChild;
          if (last) messages.append(last.cloneNode(true));
        },
        interruptGeneration() {
          generationToken += 1;
          activeGeneration = undefined;
          stop.hidden = true;
          continueButton.hidden = false;
          send.disabled = false;
        },
        triggerError() {
          generationToken += 1;
          activeGeneration = undefined;
          stop.hidden = true;
          continueButton.hidden = true;
          retry.hidden = false;
          send.disabled = false;
        },
      };

      breaker.addEventListener('click', () => {
        composer.removeAttribute('contenteditable');
        composer.removeAttribute('aria-label');
      });

      root.dataset.fixtureReady = 'true';
    })();
  </script>
</body>
</html>
